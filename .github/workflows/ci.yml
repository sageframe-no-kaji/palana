# pālana CI — the verification stack, cold, plus the coverage floor.
# Pre-commit carries format/lint/type-check per commit; CI is the link
# gate, the test gate, and the floor's enforcement point (ho-00 handoff).

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Ho process publication boundary
        run: scripts/check-ho-process-public

      # The .swift-format config follows the local toolchain (Swift 6.2);
      # the runner's default Xcode ships an older swift-format that cannot
      # read it. Newest available Xcode wins.
      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version

      - name: swift-format lint
        run: xcrun swift-format lint --recursive --strict Sources Tests

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict --quiet

      - name: Build (cold, full link)
        run: swift build

      - name: sshd fixture (runner sshd)
        run: scripts/ci-sshd-fixture.sh

      # Under a watchdog: a hang is bounded and sampled, never a silent
      # 30-minute job kill with no stack to read (see scripts/ci-test.sh).
      - name: Tests with coverage
        run: scripts/ci-test.sh

      # A test process that aborts leaves its stderr behind and its reason
      # in a crash report — print the report, so a red run names the
      # fatal error and the crashed thread instead of "signal code 6".
      - name: Crash reports (on failure)
        if: failure()
        run: |
          dir="$HOME/Library/Logs/DiagnosticReports"
          ls -t "$dir" 2>/dev/null | head -5
          for f in $(ls -t "$dir"/*.ips 2>/dev/null | head -3); do
            echo "===== $f"
            python3 - "$f" <<'PY'
          import json, sys
          lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().split("\n", 1)
          body = json.loads(lines[1]) if len(lines) > 1 else {}
          print("process:", body.get("procName"), "| termination:", body.get("termination"))
          print("exception:", body.get("exception"))
          print("asi:", body.get("asi"))
          print("lastExceptionBacktrace present:", "lastExceptionBacktrace" in body)
          faulting = body.get("faultingThread", 0)
          threads = body.get("threads", [])
          if faulting < len(threads):
              images = body.get("usedImages", [])
              for frame in threads[faulting].get("frames", [])[:40]:
                  image = images[frame.get("imageIndex", 0)].get("name", "?") if images else "?"
                  print("  ", image, frame.get("symbol", ""), "+", frame.get("imageOffset", ""))
          PY
          done

      - name: Coverage floors (PalanaCore ≥90%, application logic ≥35%)
        run: scripts/coverage-floor.sh 90 35
